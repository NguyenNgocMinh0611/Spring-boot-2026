spring.application.name=study
# này là ?? thay ??i port khi c?n
# server.port=8000

# Thông tin k?t n?i Database
spring.datasource.url=jdbc:postgresql://localhost:5434/my_postgres_db
spring.datasource.username=admin
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# C?u hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# này là cách 3 khi làm v?i các query one-to-many : Batch Fetching
# khi vòng l?p g?i getCheckup thì Hibernate s? không g?i t?ng câu l?nh SELECT n?a mà
# mà gom id c?a 100 b?nh nhân l?i và dùng phép IN trong SQL
# SELECT * FROM checkups WHERE patient_id IN (1,2,...,100)
spring.jpa.properties.hibernate.default_batch_fetch_size=100


